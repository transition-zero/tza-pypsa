# -------------------------------------------------------------------------
#
#   LINKS
#   
#     Define links between nodes and their attributes.
#
#     The main components of links are:
#       - ID
#       - From node (i.e., start of the line)
#       - To node (i.e., end of the line)
#       - Initial line capacity (MW)
#       - extendable (i.e., can we build more capacity on this line?)
#
#     Link to docs: 
#       - https://pypsa.readthedocs.io/en/latest/components.html
#
#     Authors:
#       - @AlexLutaTZ
#       - @amanmajid
#       - @Handriyanti
#       - @djwels
#
# -------------------------------------------------------------------------
