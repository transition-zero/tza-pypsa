generators:

  - id: coal-subcritical
    type: coal-subcritical
    carrier: coal
    # ---
    # unique technology parameters by bus
    initial_capacity:
      JPN01: 0
      JPN02: 100
      JPN03: 0
      JPN04: 0
      JPN05: 0
      JPN06: 0
      JPN07: 0
      JPN08: 0
      JPN09: 0
    maximum_capacity:
    efficiency:
    ramp_limit_up:
    ramp_limit_down:
    p_min_pu:
    # ---
    # universal technology parameters
    extendable: false
    lifetime: 30
    committable: false
    start_up_cost: 0 # currency/MW
    shut_down_cost: 0 # currency/MW
    ramp_limit_start_up: 0 
    ramp_limit_shut_down: 0 
    min_up_time: 0 
    min_down_time: 0 

  - id: bioenergy-unspecified
    type: bioenergy-unspecified
    carrier: biomass
  
  - id: combined-cycle
    type: combined-cycle
    carrier: gas

  - id: coal-supercritical
    type: coal-supercritical
    carrier: coal

  - id: coal-ultrasupercritical
    type: coal-ultrasupercritical
    carrier: coal

  - id: oil-unspecified
    type: oil-unspecified # THIS IS DIESEL
    carrier: oil
  
  - id: geothermal-unspecified
    type: geothermal-unspecified
    carrier: geothermal

  - id: hydro-unspecified
    type: hydro-unspecified
    carrier: hydro

  - id: open-cycle-gas-turbine
    type: open-cycle-gas-turbine
    carrier: gas

  - id: photovoltaic-unspecified
    type: photovoltaic-unspecified
    carrier: solar

  - id: waste
    type: waste
    carrier: bioenergy

  - id: wind-offshore-unspecified
    type: wind-offshore-unspecified
    carrier: wind

  - id: wind-onshore
    type: wind-onshore
    carrier: wind