remote_data:

  github_api_info:
    repo_owner: 'transition-zero'
    repo_name: 'tza-asean-data'

  technology_costs:
    description: Technology costs for the ASEAN model
    git_api: application/vnd.github.v3.raw
    path_to_cost: outputs/technology-costs/

  timeseries:
    description: Timeseries data for the ASEAN model
    git_api: application/vnd.github.v3.raw
    path_to_timeseries: outputs/timeseries/

  policies:
    description: Renewables targets and climate policies
    git_api: application/vnd.github.v3.raw
    path_to_policy: outputs/policies-and-targets/