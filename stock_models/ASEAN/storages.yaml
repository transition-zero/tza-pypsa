storages:

  - id: lithium-ion
    type: battery
    carrier: battery
    extendable: true
    lifetime: 15
    state_of_charge_initial: 0
    max_hours: 6
    efficiency_store: 0.95
    efficiency_dispatch: 0.95
    standing_loss: 0.004 # 0.1% per day = 0.004% per hour
    cyclic_state_of_charge: true
    initial_capacity:
      IDNSM: 0.
      IDNJW: 0.
      IDNNU: 0.
      IDNKA: 0.
      IDNSL: 0.
      IDNML: 0.
      IDNPP: 0.
      MYSPE: 0.
      MYSSK: 60
      MYSSH: 0.
      PHLLU: 0.
      PHLVI: 0.
      PHLMI: 0.
      SGPXX: 207.5
      BRNXX: 0.
      MMRXX: 0.
      THANO: 0.
      THASO: 0.
      THACE: 0.
      VNMNO: 0.
      VNMCE: 0.
      VNMSO: 0.
      KHMXX: 0.
      LAOXX: 0.
      BTMSL: 0.
    planned_expansion:
      SGPXX: 
        # 2030: 7.5 
        2040: -200
      # MYSSK: 
      #   2030: 60     


  - id: hydro-pumped-storage
    type: hydro-pumped-storage
    carrier: hydro # should be: hydro-storage but we follow THA for now
    extendable: false
    lifetime: 60
    state_of_charge_initial: 0
    max_hours: 10
    efficiency_store: 0.8
    efficiency_dispatch: 0.8
    standing_loss: 0.01 # need to be checked
    cyclic_state_of_charge: true
    initial_capacity:
      PHLLU: 736
      THANO: 1171
      THACE: 360
      MYSPE: 0
      MYSSK: 0
    planned_expansion:
      VNMCE: 
        2028: 1200
      PHLLU:
        2030: 500
    maximum_capacity: 
      PHLLU: 1236 # similar as planned and installed capacity in 2023
      VNMCE: 1200 # similar as planned capacity
      THANO: 1171 # similar as installed capacity in 2023
      THACE: 360 # similar as installed capacity in 2023
      MYSPE: 480 # 10% of MYSPE's hydro potential capacity
      MYSSK: 2040 # 20% of MYSSK's hydro potential capacity
      MYSSH: 110 # 10% of MYSSH's hydro potential capacity


